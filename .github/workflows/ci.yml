name: CI

on:
  push:
  pull_request:

jobs:
  moonbit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install MoonBit
        shell: bash
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Show toolchain versions
        run: |
          moon version
          node --version
      - name: Check formatting
        run: moon fmt --check
      - name: Check warnings
        run: moon check --deny-warn
      - name: Run tests
        run: moon test --deny-warn
      - name: Verify generated interfaces
        run: moon info
      - name: Build CLI
        run: moon build --target js src/cmd/moonlayout
      - name: Run CLI integration tests
        run: node --test tests/cli.integration.test.mjs
      - name: Audit example snapshot
        run: moon run src/cmd/moonlayout -- --input examples/pipeline.snapshot --report audit-report.json --svg audit.svg
